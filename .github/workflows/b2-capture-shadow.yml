# B2 Job A — hourly shadow capture (Tactical + Execution)
#
# AUTOMATED SCHEDULE ACTIVE.
# Runs every hour at minute 07 UTC.
#
# The workflow_dispatch trigger is also retained so an operator can still run
# the workflow manually or perform a dry-run configuration check.
#
# Minute 00 is the most congested minute on the platform and suffers the longest
# delays, while :07 keeps 53 minutes of headroom before a delayed run would slip
# into the next hour bucket. Delay INSIDE the intended hour is harmless — the
# bucket is the identity, so a late run produces the same record ids and the
# database collapses it. Delay that CROSSES the hour captures the current
# legitimate bucket instead; the missed hour stays a documented evidence gap and
# is never fabricated.
#
# One-writer cutover completed before schedule activation:
# Streamlit B2 shadow capture is disabled and GitHub Actions is the durable
# external writer.
#
# This workflow writes nothing to the repository. It has no write token, makes
# no commit, creates no tag, pushes nothing and uploads no artifact.

name: b2-capture-shadow

on:
  schedule:
    - cron: "37 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate configuration only; write no evidence and no heartbeat"
        type: boolean
        required: false
        default: false

# Least privilege. The job only reads code and talks to Supabase over the
# network; it never needs to write back to the repository.
permissions:
  contents: read

concurrency:
  group: b2-capture-shadow
  # NEVER cancel an in-flight capture. Cancelling mid-write is the one way to
  # create the partial state that the lease and the idempotent writes exist to
  # avoid, and a superseded run costs nothing because the hour bucket collapses.
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest

    # Generous on purpose: an external runner starts COLD. None of the caches
    # the in-daemon hook rode are warm here, so every run re-fetches its
    # upstream inputs for all instruments.
    timeout-minutes: 20

    steps:
      # Pinned to verified full commit SHAs rather than movable tags.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # Secrets reach the dispatcher as environment variables and are written to
      # .streamlit/secrets.toml by Python, never by a shell. The dispatcher
      # reports only secret NAMES and never secret values.
      #
      # B2_SHADOW_ENABLED is deliberately NOT set here. Streamlit has its own
      # B2_SHADOW_ENABLED="0" setting after the one-writer cutover.
      - name: Run shadow capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python -m apex.ops run capture-shadow \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when the job failed, so a materialised secrets file never
      # outlives the step that needed it.
      - name: Remove materialised secrets
        if: always()
        run: rm -f .streamlit/secrets.toml
